<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#3154d5" />
    <title>PaperTrade IN</title>
    <style>
      :root { --canvas:#f1f5ff; --surface:#fff; --ink:#1d2c4a; --muted:#596c88; --line:#dce4f4; --accent:#3154d5; --on-accent:#fff; color-scheme:light; }
      @media (prefers-color-scheme:dark) { :root { --canvas:#080f1c; --surface:#101c2e; --ink:#e6f1ff; --muted:#a2b8d2; --line:#253c55; --accent:#41dfef; --on-accent:#06232f; color-scheme:dark; } }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        margin: 0;
        padding: 24px;
        color: var(--ink);
        background: var(--canvas);
        font: 500 15px/1.5 system-ui, sans-serif;
        text-align: center;
      }
      main { max-width: 340px; }
      img { display: block; width: 104px; height: 104px; margin: 0 auto 16px; object-fit: contain;  }
      b { display: block; margin-bottom: 8px; color: var(--accent); font-size: 24px; }
    </style>
  </head>
  <body>
    <main><img src="papertrade-mark.svg" alt="" /><b>PaperTrade IN</b><span>Loading your trading workspace&hellip;</span></main>
  </body>
</html>
