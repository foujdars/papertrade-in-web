<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#6657ee" />
    <title>PaperTrade IN — Offline</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        margin: 0;
        padding: 24px;
        color: #20263b;
        background: linear-gradient(145deg, #f7f5ff, #fff);
        font: 500 15px/1.5 system-ui, sans-serif;
        text-align: center;
      }
      main { max-width: 340px; padding: 28px; border: 1px solid #ddd9ff; border-radius: 18px; background: #fff; box-shadow: 0 16px 50px #20263b1a; }
      b { display: block; margin-bottom: 8px; color: #6657ee; font-size: 24px; }
      p { color: #68728a; }
      button { height: 42px; border: 0; border-radius: 9px; padding: 0 20px; color: #fff; background: #6657ee; font-weight: 800; }
    </style>
  </head>
  <body>
    <main>
      <b>PaperTrade IN</b>
      <p>The chart needs an internet connection for market data. Reconnect, then try again.</p>
      <button onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
