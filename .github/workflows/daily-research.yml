name: Daily NSE research scan
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-research.yml'
      - 'config/research-universe.json'
      - 'scripts/collect-research.py'
      - 'scripts/daily-research.ts'
      - 'lib/research.ts'
  schedule:
    # 10:45 UTC = 16:15 IST, Monday–Friday. GitHub may delay scheduled runs.
    - cron: '45 10 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-nse-research
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install public data collector
        run: pip install 'beautifulsoup4>=4.13,<5'
      - name: Verify research and risk rules
        run: |
          python tests/research-collector.py
          node --experimental-strip-types --test tests/research.test.mjs tests/portfolio-research-bot.test.mjs
      - name: Collect dated research
        run: python scripts/collect-research.py
      - name: Score and publish snapshot
        run: node --experimental-strip-types scripts/daily-research.ts
      - name: Persist results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/research/daily.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update daily NSE research [skip ci]'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
