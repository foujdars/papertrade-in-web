name: Apply chart fix
on:
  push:
    paths:
      - ".github/chart-fix.patch"
      - ".github/workflows/apply-chart-fix.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply MarketChart patch
        run: |
          set -euo pipefail
          if [ ! -f .github/chart-fix.patch ]; then
            echo "patch already consumed"
            exit 0
          fi
          actual=$(sha256sum .github/chart-fix.patch | awk '{print $1}')
          expected=a2c49f7de3bbd2807e0c78ab521022912fda75e140c4911b29f068fce818b1d4
          if [ "$actual" != "$expected" ]; then
            echo "patch checksum mismatch: $actual"
            exit 1
          fi
          git apply --whitespace=nowarn .github/chart-fix.patch
          blob=$(git hash-object components/MarketChart.tsx)
          if [ "$blob" != "06c48ef929b95154d877464086087b6323050f65" ]; then
            echo "MarketChart blob mismatch: $blob"
            exit 1
          fi
          cat > vercel.json << 'EOF'
          {
            "$schema": "https://openapi.vercel.sh/vercel.json",
            "framework": "nextjs",
            "buildCommand": "next build && node scripts/verify-coach-assets.mjs"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/MarketChart.tsx vercel.json
          git rm -f .github/chart-fix.patch .github/workflows/apply-chart-fix.yml
          git commit -m "Hide the dotted last-price line and open the full crosshair price menu."
          git push origin HEAD:main
