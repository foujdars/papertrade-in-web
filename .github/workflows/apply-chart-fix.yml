name: Apply chart fix
on:
  push:
    paths:
      - ".github/chart-fix.patch"
      - ".github/workflows/apply-chart-fix.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply closed-app notifications
        run: |
          set -euo pipefail
          if [ ! -f .github/patch-parts/07 ]; then
            echo "patch parts missing"
            exit 1
          fi
          cat .github/patch-parts/00 .github/patch-parts/01 .github/patch-parts/02 .github/patch-parts/03 .github/patch-parts/04 .github/patch-parts/05 .github/patch-parts/06 .github/patch-parts/07 > .github/chart-fix.patch
          actual=$(sha256sum .github/chart-fix.patch | awk '{print $1}')
          expected=c31447c9cb2a486c5b27883436fad59ddd9bed38b04c931d380ed4a79268024d
          if [ "$actual" != "$expected" ]; then
            echo "patch checksum mismatch: $actual"
            exit 1
          fi
          git apply --whitespace=nowarn .github/chart-fix.patch
          check() {
            local file="$1" want="$2" got
            got=$(git hash-object "$file")
            if [ "$got" != "$want" ]; then
              echo "blob mismatch $file: $got"
              exit 1
            fi
          }
          check lib/notification-preferences.ts abb8313b3de4cd0770ab8fb8d464a516005ba471
          check lib/notification-policy.ts 00f48ab54cdeedb105299316a7f2cf2fb8176c00
          check lib/market-sessions.ts 63beac1fc8004d4c018cd0ac400f9cffdb3abee8
          check lib/global-alerts-server.ts ed6913c169df48f478d018b5afe936cbf5969e40
          check components/NotificationSettings.tsx d7b06f310e7f23a03350a303dfaf83c359f07ffa
          check components/PushNotificationBridge.tsx 1c97f2418610660abf0a0046d2fd4ff450c64357
          check components/NotificationCenter.tsx c73e093f874d42b2837dac6243ae6008d80e5be5
          check components/SessionOpenAlerts.tsx 5a24e0fb905e66b1d3e9158ec28c9d7a393be0b7
          check components/PriceActions.tsx 676e7147f30de5c3f3bedef078744f8a79dbd121
          check components/TechnicalAlertForm.tsx 6dc9e1744e3ae01bf7c5fb7cfb57f3d269c8c2a4
          check components/useTechnicalAlerts.ts d89f9989a19471333616b059543d39ac3e4ccae3
          check components/useCloudTechnicalAlerts.ts a6437c28352a22f153f639807b7aae440fe7ca1c
          check public/notifications-sw.js 47b1b8166d565c3d5770735616da485faeba3cd0
          check app/api/notifications/dispatch/route.ts 99d7a409fdafe92580ca430218077ec18f732de5
          check app/api/notifications/device/route.ts b89ba3405b80e28eca08197fffc694dcfc2be92f
          check app/api/technical-alerts/dispatch/route.ts 87e009b8f862155a7b116793bd9d1b6dac59b4d5
          if ! grep -q 'alerts reach you even when the app is closed' components/NotificationSettings.tsx; then
            echo "notification copy missing"
            exit 1
          fi
          if grep -q 'While app is open' components/PriceActions.tsx components/TechnicalAlertForm.tsx components/NotificationSettings.tsx; then
            echo "monitoring selector still present"
            exit 1
          fi
          cat > vercel.json << 'EOF'
          {
            "$schema": "https://openapi.vercel.sh/vercel.json",
            "framework": "nextjs",
            "buildCommand": "next build && node scripts/verify-coach-assets.mjs"
          }
          EOF
          python3 -c 'import json; json.load(open("vercel.json")); assert "ignoreCommand" not in open("vercel.json").read()'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/notification-preferences.ts lib/notification-policy.ts lib/market-sessions.ts lib/global-alerts-server.ts components/NotificationSettings.tsx components/PushNotificationBridge.tsx components/NotificationCenter.tsx components/SessionOpenAlerts.tsx components/PriceActions.tsx components/TechnicalAlertForm.tsx components/useTechnicalAlerts.ts components/useCloudTechnicalAlerts.ts public/notifications-sw.js app/api/notifications/dispatch/route.ts app/api/notifications/device/route.ts app/api/technical-alerts/dispatch/route.ts vercel.json
          git rm -f .github/chart-fix.patch .github/workflows/apply-chart-fix.yml .github/patch-parts/00 .github/patch-parts/01 .github/patch-parts/02 .github/patch-parts/03 .github/patch-parts/04 .github/patch-parts/05 .github/patch-parts/06 .github/patch-parts/07
          git commit -m "Send one-line alerts by default, even when the app is closed."
          git push origin HEAD:main
