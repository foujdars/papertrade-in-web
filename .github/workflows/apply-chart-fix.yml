name: Apply chart fix
on:
  push:
    paths:
      - ".github/chart-fix.patch"
      - ".github/workflows/apply-chart-fix.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove crosshair price tag
        run: |
          set -euo pipefail
          if [ ! -f .github/chart-fix.patch ]; then
            echo "patch already consumed"
            exit 0
          fi
          actual=$(sha256sum .github/chart-fix.patch | awk '{print $1}')
          expected=7e936e36b6b982b786f1670c8213c77a053a015d9df7aa1aff76ee7cae56d78f
          if [ "$actual" != "$expected" ]; then
            echo "patch checksum mismatch: $actual"
            exit 1
          fi
          git apply --whitespace=nowarn .github/chart-fix.patch
          chart=$(git hash-object components/MarketChart.tsx)
          css=$(git hash-object app/price-actions.css)
          if [ "$chart" != "221454fcefea9602b07d3b9ad8a68e68b7b72749" ]; then
            echo "MarketChart blob mismatch: $chart"
            exit 1
          fi
          if [ "$css" != "c9acd8bf0d424981b01f6fe985a53a8d7037f59b" ]; then
            echo "price-actions.css blob mismatch: $css"
            exit 1
          fi
          if grep -q 'chart-crosshair-tag\|priceMenu\|chart-price-plus' components/MarketChart.tsx app/price-actions.css; then
            echo "price tag still present"
            exit 1
          fi
          cat > vercel.json << 'EOF'
          {
            "$schema": "https://openapi.vercel.sh/vercel.json",
            "framework": "nextjs",
            "buildCommand": "next build && node scripts/verify-coach-assets.mjs"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/MarketChart.tsx app/price-actions.css vercel.json
          git rm -f .github/chart-fix.patch .github/workflows/apply-chart-fix.yml
          git commit -m "Remove the crosshair plus, its price label, and the price-action popup."
          git push origin HEAD:main
